<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>med_pex</title>
    <link href="./src/style.css" rel="stylesheet">
</head>
<body data-theme="vlc">
    <header class="top-bar">
        <div class="top-menu">
            <span class="logo-text" style="font-weight:bold; color:var(--accent-color); margin-right: 15px; font-size:1.2rem;">MediPeX 0.1.1</span>
            <div class="dropdown">
                <button class="menu-btn dropbtn">File</button>
                <div class="dropdown-content">
                    <a href="#" id="btn-open-local-menu">Open Local File...</a>
                    <a href="#" id="btn-save-menu">Save Playlist</a>
                    <a href="#" id="btn-load-menu">Load Playlist</a>
                </div>
            </div>
            <div class="dropdown">
                <button class="menu-btn dropbtn">View (Themes)</button>
                <div class="dropdown-content">
                    <a href="#" onclick="window.setTheme('vlc')">VLC</a>
                    <a href="#" onclick="window.setTheme('dark')">Dark</a>
                    <a href="#" onclick="window.setTheme('goth')">Goth</a>
                </div>
            </div>
            <div class="dropdown">
                <button class="menu-btn dropbtn">Help</button>
                <div class="dropdown-content">
                    <a href="#" id="btn-info">How to Use</a>
                    <a href="#" id="btn-about">About Us</a>
                    <a href="#" id="btn-reach">Reach Us</a>
                    <a href="#" id="btn-license">License</a>
                </div>
            </div>
            <button class="menu-btn" id="btn-settings">Settings</button>
        </div>
    </header>
    
    <div class="container">
        <!-- Player Panel -->
        <section class="panel player-panel">
            <div class="yt-search-bar" style="display: flex; gap: 10px; margin-bottom: 10px;">
                <input type="text" id="yt-query" placeholder="Search YouTube or paste a link..." style="flex: 1; padding: 8px; border-radius: 4px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color);">
                <button id="btn-search-yt" class="action-btn" style="margin: 0; background-color: var(--accent-color); color: white; border: none;">Search</button>
            </div>
            <div class="video-container" style="position: relative;">
                <video id="media-player"></video>
                <iframe id="yt-iframe" style="display: none; width: 100%; height: 100%; min-height: 400px; border-radius: 8px;" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            
            <!-- Custom Player Controls -->
            <div class="player-controls" style="display: flex; gap: 8px; align-items: center; padding: 10px; background: var(--panel-bg); border: 1px solid var(--border-color); margin-top: 10px; border-radius: 4px;">
                <button class="menu-btn" id="btn-playpause" title="Play/Pause">⏯</button>
                <button class="menu-btn" id="btn-stop" title="Stop">⏹</button>
                <button class="menu-btn" id="btn-prev" title="Previous">⏮</button>
                <button class="menu-btn" id="btn-next" title="Next">⏭</button>
                
                <input type="range" id="seek-bar" value="0" min="0" max="100" style="flex: 1; cursor: pointer;">
                <span id="time-display" style="font-size: 0.85rem; font-family: monospace;">00:00 / 00:00</span>
                
                <button class="menu-btn" id="btn-mute" title="Mute/Unmute">🔊</button>
                <input type="range" id="vol-bar" min="0" max="1" step="0.05" value="1" title="Volume" style="width: 70px; cursor: pointer;">
                <button class="menu-btn" id="btn-boost" title="Enable Volume Booster (300%)">🚀</button>
                
                <button class="menu-btn" id="btn-speed" title="Playback Speed">1.0x</button>
                <button class="menu-btn" id="btn-ab-repeat" title="A-B Repeat">A-B</button>
            </div>
            
            <div class="controls" style="margin-top: 10px;">
                <button id="btn-open-local">Open Local File</button>
                <div id="yt-download-controls" style="display: none; align-items: center; gap: 5px;">
                    <select id="download-format-select" style="padding: 6px; border-radius: 4px; background: var(--panel-bg); color: var(--text-color); border: 1px solid var(--border-color);">
                        <!-- Dynamically populated -->
                    </select>
                    <button id="btn-download-yt" style="background: #28a745;">Download</button>
                </div>
            </div>
        </section>

        <!-- Equalizer Panel -->
        <section class="panel eq-panel">
            <div class="eq-header">
                <h2>Equalizer</h2>
                <div class="eq-controls">
                    <label class="switch">
                        <input type="checkbox" id="eq-toggle">
                        <span class="slider round"></span>
                    </label>
                    <select id="eq-presets">
                        <option value="flat">Flat / Default</option>
                        <option value="large-hall">Large Hall</option>
                        <option value="small-room">Small Room</option>
                        <option value="acoustic">Acoustic</option>
                        <option value="bass-booster">Bass Booster</option>
                        <option value="electronic">Electronic</option>
                        <option value="pop">Pop</option>
                    </select>
                </div>
            </div>
            <div class="eq-sliders">
                <div class="slider-wrapper">
                    <input type="range" min="-12" max="12" value="0" class="eq-slider" data-freq="60">
                    <label>60Hz</label>
                </div>
                <div class="slider-wrapper">
                    <input type="range" min="-12" max="12" value="0" class="eq-slider" data-freq="230">
                    <label>230Hz</label>
                </div>
                <div class="slider-wrapper">
                    <input type="range" min="-12" max="12" value="0" class="eq-slider" data-freq="910">
                    <label>910Hz</label>
                </div>
                <div class="slider-wrapper">
                    <input type="range" min="-12" max="12" value="0" class="eq-slider" data-freq="3600">
                    <label>3.6kHz</label>
                </div>
                <div class="slider-wrapper">
                    <input type="range" min="-12" max="12" value="0" class="eq-slider" data-freq="14000">
                    <label>14kHz</label>
                </div>
            </div>
        </section>

        <!-- Playlist / Search Results Panel -->
        <section class="panel playlist-panel">
            <div class="playlist-header">
                <h2>Playlist</h2>
                <div style="display: flex; gap: 5px;">
                    <button id="btn-add-file" class="menu-btn" title="Add Media">➕</button>
                    <button id="btn-refresh-playlist" class="menu-btn" title="Refresh Order">🔄</button>
                    <button id="btn-shuffle" class="menu-btn" title="Shuffle Playlist">🔀</button>
                    <button id="btn-repeat" class="menu-btn" title="Repeat Playlist">🔁</button>
                </div>
            </div>
            
            <div class="playlist-table-container">
                <table id="playlist-table">
                    <thead>
                        <tr>
                            <th style="width: 40px;">Sl.No</th>
                            <th style="width: 50px;">Thumb</th>
                            <th style="width: 70px;">Source</th>
                            <th>Title</th>
                            <th style="width: 70px;">Time</th>
                            <th style="width: 40px;">Act</th>
                        </tr>
                    </thead>
                    <tbody id="playlist-body">
                        <!-- Items injected via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Modal for Info/Settings -->
    <div id="info-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modal-title" style="margin-top: 0; color: var(--accent-color);">Title</h2>
            <div id="modal-body" style="line-height: 1.5; font-size: 0.95rem;">Content</div>
        </div>
    </div>
    
    <!-- Modal for Loading Playlists -->
    <div id="load-playlist-modal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <span class="close-modal" id="close-load-modal">&times;</span>
            <h2 style="margin-top: 0; color: var(--accent-color);">Load Saved Playlist</h2>
            <ul id="saved-playlists-list" style="list-style: none; padding: 0;">
                <!-- Injected via JS -->
            </ul>
        </div>
    </div>

    <!-- Context Menu for Playlist Items -->
    <div id="context-menu" style="position: absolute; display: none; background: var(--panel-bg); border: 1px solid var(--border-color); box-shadow: 2px 2px 10px rgba(0,0,0,0.5); z-index: 1000; flex-direction: column; border-radius: 4px; padding: 5px 0;">
        <button id="ctx-copy-link" style="background: none; border: none; color: var(--text-color); padding: 8px 15px; text-align: left; cursor: pointer; width: 100%;">🔗 Copy Link</button>
        <button id="ctx-add-to-list" style="background: none; border: none; color: var(--text-color); padding: 8px 15px; text-align: left; cursor: pointer; width: 100%;">📁 Add to saved list...</button>
        <button id="ctx-create-new-list" style="background: none; border: none; color: var(--text-color); padding: 8px 15px; text-align: left; cursor: pointer; width: 100%;">📝 Create new list with this</button>
    </div>

    <!-- Modal for Adding to existing list -->
    <div id="add-to-list-modal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <span class="close-modal" id="close-add-to-list-modal">&times;</span>
            <h2 style="margin-top: 0; color: var(--accent-color);">Add to Saved Playlist</h2>
            <ul id="append-playlists-list" style="list-style: none; padding: 0;">
                <!-- Injected via JS -->
            </ul>
        </div>
    </div>

    <script src="./src/main.js" type="module"></script>
</body>
</html>
